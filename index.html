{id:'m0',num:'00',title:'BÀI KHỞI ĐỘNG',desc:'Cài đặt tài khoản, làm quen hệ sinh thái và lộ trình học 4 tuần.',lessons:[
{id:'m0l1',title:'Cài đặt tài khoản & lộ trình 4 tuần',minutes:30,
body:'<p>Chào mừng bạn đến với khóa <b>Đồng Hành Làm Chủ Gemini & Hệ Sinh Thái Google</b>. Trước khi vào module 1, hãy hoàn tất 4 việc sau để học trơn tru nhất.</p><h4>1. Kích hoạt tài khoản Google Pro</h4><ul><li>Tài khoản Google Pro (trị giá 699k) đã được tặng kèm khi bạn đăng ký khóa học — kiểm tra email để nhận.</li><li>Đăng nhập tài khoản này trên cả điện thoại và máy tính.</li></ul><h4>2. Mở Gemini và làm quen</h4><ul><li>Truy cập <code>gemini.google.com</code> hoặc tải app Gemini trên điện thoại.</li><li>Thử hỏi 3 câu về công việc của bạn để cảm nhận cách AI trả lời.</li></ul><h4>3. Tham gia cộng đồng đồng hành</h4><ul><li>Vào nhóm Zalo của khóa học để hỏi đáp, nộp bài tập và nhận thông báo lịch Zoom.</li><li>Lịch Zoom hỗ trợ trực tiếp: <b>mỗi tuần 1 buổi</b> (thông báo trong nhóm).</li></ul><h4>4. Lộ trình 4 tuần</h4><ul><li><b>Tuần 1:</b> Module Cá nhân hóa → Lưu trữ → Xử lý dữ liệu.</li><li><b>Tuần 2:</b> Module Skill → Tạo ảnh → Tạo video.</li><li><b>Tuần 3:</b> Module Tạo ứng dụng → Tạo landing page.</li><li><b>Tuần 4:</b> Module Tự động hóa → Dự án tốt nghiệp.</li></ul><p>Nguyên tắc vàng: <b>xem bài nào, thực hành ngay bài đó</b> trên chính công việc của bạn. Đừng chỉ xem cho biết.</p>',
exercise:'Hoàn tất checklist: (1) đăng nhập Gemini bằng tài khoản Pro, (2) vào nhóm Zalo khóa học, (3) chụp màn hình giao diện Gemini của bạn gửi vào nhóm với hashtag #khoi-dong.'}
]},

{id:'m1',num:'01',title:'MODULE CÁ NHÂN HÓA',desc:'Biến Gemini thành trợ lý hiểu bạn: phong cách riêng, Gem riêng, ký ức riêng.',lessons:[
{id:'m1l1',title:'Vì sao phải cá nhân hóa AI?',minutes:20,
body:'<p>Cùng một câu hỏi, 10 người nhận 10 câu trả lời khác nhau — người được cá nhân hóa tốt sẽ nhận câu trả lời <b>đúng ý mình ngay lần đầu</b>, tiết kiệm hàng giờ chỉnh sửa.</p><h4>3 lớp cá nhân hóa trong Gemini</h4><ul><li><b>Lớp 1 – Tài khoản:</b> ngôn ngữ, múi giờ, vị trí.</li><li><b>Lớp 2 – Chỉ dẫn (instructions):</b> bạn là ai, muốn AI trả lời theo phong cách nào.</li><li><b>Lớp 3 – Bộ nhớ (memory):</b> AI nhớ thông tin về bạn qua các cuộc trò chuyện.</li></ul><p>Càng đầu tư cho 3 lớp này, AI càng giống một nhân viên đã làm việc với bạn 3 năm.</p>',
exercise:'Viết ra 5 dòng mô tả: bạn là ai, công việc gì, khách hàng của bạn là ai, giọng văn bạn thích, điều bạn ghét ở câu trả lời của AI. Lưu lại — sẽ dùng ở bài tiếp theo.'},
{id:'m1l2',title:'Thiết lập phong cách trả lời trong Gemini',minutes:25,
body:'<p>Vào <b>Cài đặt → Cá nhân hóa</b> trong Gemini và điền thông tin của bạn.</p><h4>Mẫu chỉ dẫn cho người bán hàng online</h4><ul><li><i>"Tôi là chủ shop thời trang nữ, khách hàng 25–35 tuổi ở TP.HCM."</i></li><li><i>"Trả lời ngắn gọn, dùng emoji vừa phải, luôn kèm 1 câu kêu gọi hành động."</i></li><li><i>"Khi viết bài bán hàng: mở đầu bằng nỗi đau khách hàng, kết thúc bằng ưu đãi."</i></li></ul><h4>Mẫu cho người làm nội dung</h4><ul><li><i>"Tôi làm video ngắn về phong thủy. Văn phong gần gũi, miền Nam."</i></li><li><i>"Kịch bản luôn có hook 3 giây đầu và CTA follow ở cuối."</i></li></ul><p>Test ngay: hỏi lại một câu bạn từng hỏi, so sánh chất lượng trước–sau.</p>',
exercise:'Điền chỉ dẫn cá nhân vào Gemini, sau đó yêu cầu viết 1 đoạn giới thiệu sản phẩm của bạn. Chụp kết quả gửi vào nhóm.'},
{id:'m1l3',title:'Tạo Gem – trợ lý AI của riêng bạn',minutes:35,
body:'<p><b>Gem</b> là trợ lý AI chuyên biệt do chính bạn tạo ra: Gem bán hàng, Gem viết content, Gem trợ lý học tập... Mỗi Gem có "bộ não" (system prompt) riêng.</p><h4>Công thức system prompt 4 phần</h4><ol><li><b>Vai trò:</b> "Bạn là chuyên gia tư vấn mỹ phẩm 10 năm kinh nghiệm..."</li><li><b>Nhiệm vụ:</b> "...tư vấn routine skincare theo loại da và ngân sách."</li><li><b>Ràng buộc:</b> "Trả lời tối đa 150 từ, không dùng từ ngữ y khoa khó hiểu."</li><li><b>Ví dụ:</b> đưa 1–2 ví dụ câu trả lời mẫu (few-shot).</li></ol><p>Tạo Gem tại: Gemini → Khám phá Gem → Tạo Gem. Đặt tên, viết hướng dẫn theo công thức trên, thử hội thoại và tinh chỉnh.</p>',
exercise:'Tạo 1 Gem phục vụ công việc chính của bạn (ví dụ: Gem tư vấn sản phẩm, Gem viết caption). Chia sẻ tên Gem + ảnh chụp đoạn chat test vào nhóm.'},
{id:'m1l4',title:'Quản lý bộ nhớ & lịch sử chat',minutes:20,
body:'<p>Bộ nhớ giúp Gemini nhớ bạn là ai qua nhiều phiên chat — nhưng cần quản lý chủ động.</p><ul><li><b>Bật/tắt:</b> Cài đặt → Bộ nhớ. Nên bật cho tài khoản công việc.</li><li><b>Xem & xóa ký ức:</b> định kỳ xem lại, xóa thông tin cũ/sai (ví dụ đổi số điện thoại, đổi sản phẩm).</li><li><b>Câu lệnh chủ động:</b> gõ <code>"Hãy nhớ rằng..."</code> để lưu, <code>"Quên điều này đi..."</code> để xóa.</li><li><b>Tổ chức chat:</b> mỗi dự án một chuỗi chat riêng, đặt tên rõ ràng thay vì để "Cuộc trò chuyện mới".</li></ul><p>Lưu ý riêng tư: đừng lưu mật khẩu, số tài khoản ngân hàng vào bộ nhớ AI.</p>',
exercise:'Rà soát bộ nhớ Gemini của bạn: xóa 3 thông tin cũ/không cần thiết, lưu 3 thông tin quan trọng về công việc hiện tại.'}
]},

{id:'m2',num:'02',title:'MODULE LƯU TRỮ DỮ LIỆU',desc:'Drive, Docs, Sheets, Keep gọn gàng + NotebookLM: thư viện tri thức AI.',lessons:[
{id:'m2l1',title:'Tổ chức Google Drive như dân pro',minutes:25,
body:'<p>Drive lộn xộn = mất 15 phút mỗi lần tìm file. Cấu trúc chuẩn 3 tầng:</p><ul><li><b>Tầng 1 – Danh mục lớn:</b> <code>01-Kinh doanh / 02-Content / 03-Tài chính / 04-Học tập</code>.</li><li><b>Tầng 2 – Dự án:</b> trong Kinh doanh có <code>Don-hang-2026</code>, <code>San-pham</code>...</li><li><b>Tầng 3 – Năm/tháng</b> cho file thời vụ.</li></ul><h4>Mẹo pro</h4><ul><li>Tô màu thư mục quan trọng, dùng <b>Shortcut</b> thay vì copy file lung tung.</li><li>Tìm kiếm nâng cao: <code>type:pdf owner:me "báo giá"</code>.</li><li>Đặt tên file theo chuẩn: <code>YYYYMMDD_Tên-file_v1</code>.</li></ul>',
exercise:'Dọn Drive của bạn theo cấu trúc 3 tầng, đổi tên 10 file quan trọng nhất theo chuẩn YYYYMMDD.'},
{id:'m2l2',title:'Docs – Sheets – Keep: bộ ba ghi chép',minutes:30,
body:'<ul><li><b>Google Docs:</b> soạn kịch bản, tài liệu sản phẩm. Dùng <i>Chế độ đề xuất</i> khi cộng tác, <i>Lịch sử phiên bản</i> để quay lại bản cũ.</li><li><b>Google Sheets:</b> quản lý đơn hàng, kho, thu chi. Dùng <i>Bộ lọc</i> + <i>Chế độ xem lọc</i> để mỗi người xem 1 góc riêng.</li><li><b>Google Keep:</b> ghi nhanh ý tưởng content, checklist; ghim note quan trọng, đặt nhắc giờ.</li></ul><p>Tạo 1 bộ template dùng lại mãi mãi: <i>Kịch bản video</i> (Docs), <i>Sổ đơn hàng</i> (Sheets), <i>Kho ý tưởng</i> (Keep).</p>',
exercise:'Tạo 3 template trên và lưu vào thư mục Drive "04-Hoc-tap".'},
{id:'m2l3',title:'Chia sẻ & phân quyền an toàn',minutes:20,
body:'<ul><li><b>3 quyền:</b> Người xem / Người nhận xét / Người chỉnh sửa — luôn cấp quyền <b>thấp nhất đủ dùng</b>.</li><li>Chia sẻ link: chọn <i>"Bất kỳ ai có đường liên kết"</i> chỉ khi thật sự cần công khai.</li><li>Tắt <i>"cho phép tải xuống/in"</i> với tài liệu nội bộ quan trọng.</li><li>Định kỳ vào <b>Drive → Được chia sẻ với tôi</b> để thu hồi quyền cũ.</li><li>Bật <b>xác minh 2 bước</b> cho tài khoản Google — bắt buộc.</li></ul>',
exercise:'Kiểm tra 5 file/folder bạn đang chia sẻ: thu hồi những quyền không còn cần thiết.'},
{id:'m2l4',title:'Bonus: NotebookLM – thư viện tri thức AI',minutes:30,
body:'<p><b>NotebookLM</b> là "thủ thư AI": bạn nạp tài liệu vào, nó chỉ trả lời <b>dựa trên tài liệu của bạn</b> — không bịa.</p><ul><li>Tạo notebook mới, tải lên: catalogue sản phẩm, chính sách bán hàng, tài liệu đào tạo (PDF/Docs/web).</li><li>Hỏi: <i>"Tóm tắt 5 điểm khác biệt của sản phẩm A"</i> — kèm trích dẫn đúng trang.</li><li>Dùng <b>Audio Overview</b> để nghe tóm tắt dạng podcast khi đang di chuyển.</li><li>Chia sẻ notebook cho nhân viên/cộng tác viên như một "nhân viên đào tạo AI" 24/7.</li></ul>',
exercise:'Tạo 1 notebook chứa toàn bộ thông tin sản phẩm/dịch vụ chính của bạn, test 5 câu hỏi khách hàng hay hỏi nhất.'}
]},

{id:'m3',num:'03',title:'MODULE XỬ LÝ DỮ LIỆU',desc:'Biến số liệu thô thành quyết định: Gemini trong Sheets, Apps Script, báo cáo tự động.',lessons:[
{id:'m3l1',title:'Gemini trong Google Sheets',minutes:30,
body:'<p>Mở Sheets → biểu tượng <b>✦ Ask Gemini</b> ở góc phải. Những việc làm trong 1 phút:</p><ul><li><i>"Tóm tắt bảng này: tháng nào bán chạy nhất, sản phẩm nào ế?"</i></li><li><i>"Làm sạch cột SĐT: bỏ khoảng trắng, chuẩn hóa đầu số."</i></li><li><i>"Viết công thức tính hoa hồng theo 3 mức doanh số."</i> — copy công thức vào ô.</li><li><i>"Tạo biểu đồ doanh thu theo tuần từ dữ liệu này."</i></li></ul><p>Quy tắc: mô tả rõ bạn muốn <b>kết quả gì</b>, đừng chỉ nói "phân tích giúp tôi".</p>',
exercise:'Lấy 1 file dữ liệu thật của bạn (đơn hàng/kho/thu chi), dùng Ask Gemini trả lời 3 câu hỏi kinh doanh.'},
{id:'m3l2',title:'Phân tích dữ liệu bán hàng thực tế',minutes:35,
body:'<p>Case study: file 500 đơn hàng 3 tháng. Quy trình 4 bước:</p><ol><li><b>Làm sạch:</b> trùng đơn, SĐT sai, thiếu địa chỉ.</li><li><b>Mô tả:</b> tổng đơn, doanh thu, giá trị đơn trung bình, tỉ lệ hoàn.</li><li><b>Đào sâu:</b> top 5 sản phẩm, khung giờ chốt đơn tốt nhất, tỉnh thành mua nhiều nhất.</li><li><b>Hành động:</b> 3 quyết định cụ thể (tăng nhập hàng A, chạy ads khung giờ B...).</li></ol><p>Nhờ Gemini viết phần "nhận định", bạn là người ra quyết định cuối cùng.</p>',
exercise:'Chạy đủ 4 bước trên dữ liệu thật của bạn, viết 3 quyết định hành động cho tháng tới.'},
{id:'m3l3',title:'Apps Script cơ bản: script đầu tiên',minutes:40,
body:'<p><b>Apps Script</b> là "lập trình không cần học lập trình" — bạn mô tả, Gemini viết code, bạn dán vào chạy.</p><ul><li>Mở Sheets → Tiện ích → Apps Script.</li><li>Nhờ Gemini: <i>"Viết script tự động tô đỏ các đơn quá 3 ngày chưa giao trong sheet DonHang"</i>.</li><li>Dán code → Lưu → Chạy → Cấp quyền.</li><li>Đặt <b>Trigger</b> (kích hoạt): chạy tự động mỗi sáng 7h.</li></ul><p>Bắt đầu từ script 10–20 dòng. Chạy thử trên <b>bản copy</b> trước khi áp vào file thật.</p>',
exercise:'Tạo 1 script tự động cho file của bạn (tô màu cảnh báo, gửi mail nhắc, hoặc tự điền ngày tháng).'},
{id:'m3l4',title:'Form → Sheet → báo cáo tự động',minutes:30,
body:'<ul><li><b>Google Form:</b> tạo form đăng ký/đặt hàng/khảo sát → câu trả lời tự chảy vào Sheets.</li><li><b>Sheet trung gian:</b> dùng công thức + script làm sạch, tính toán.</li><li><b>Báo cáo:</b> 1 sheet "Dashboard" với số liệu tổng + biểu đồ, tự cập nhật.</li><li><b>Thông báo:</b> script gửi email/Zalo cho bạn mỗi khi có đơn mới.</li></ul><p>Toàn bộ chuỗi này chạy tự động 24/7, bạn chỉ việc xem dashboard mỗi sáng.</p>',
exercise:'Dựng 1 form thật (đăng ký tư vấn/đặt hàng) nối vào Sheets có dashboard tổng hợp.'}
]},

{id:'m4',num:'04',title:'MODULE SKILL',desc:'Gắn siêu năng lực cho Gemini: Extensions, thư viện prompt, system prompt nâng cao.',lessons:[
{id:'m4l1',title:'Extensions: gắn siêu năng lực cho Gemini',minutes:25,
body:'<p><b>Extensions</b> cho phép Gemini "chạm" vào các app khác của Google.</p><ul><li><b>Bật:</b> Gemini → Cài đặt → Tiện ích (Extensions).</li><li><b>Google Workspace:</b> <i>"@Gmail tìm email báo giá của anh Tuấn tuần trước"</i>, <i>"@Drive tóm tắt file kế hoạch Q4"</i>.</li><li><b>YouTube:</b> <i>"Tóm tắt video này thành 5 ý chính"</i> — học từ video dài trong 1 phút.</li><li><b>Google Maps:</b> tìm địa điểm, lên lịch trình.</li><li><b>Cú pháp @:</b> gõ <code>@</code> trong ô chat để gọi đúng extension.</li></ul><p>Nguyên tắc: bật extension nào <b>dùng thật</b>, tắt bớt để tránh nhiễu.</p>',
exercise:'Bật 3 extension bạn dùng nhiều nhất, thực hiện 1 tác vụ thật với mỗi extension.'},
{id:'m4l2',title:'Xây thư viện prompt cá nhân',minutes:30,
body:'<p>Prompt tốt = tài sản. Đừng viết lại từ đầu mỗi lần.</p><h4>Cấu trúc prompt chuẩn 5 phần</h4><ol><li><b>Bối cảnh:</b> bạn là ai, đang làm gì.</li><li><b>Nhiệm vụ:</b> muốn AI làm chính xác việc gì.</li><li><b>Định dạng:</b> trả về dạng bảng / bài viết / kịch bản...</li><li><b>Giới hạn:</b> độ dài, giọng văn, điều cấm.</li><li><b>Ví dụ:</b> 1 mẫu output bạn ưng ý.</li></ol><p>Lưu thư viện vào 1 file Docs <i>"Kho Prompt"</i>, phân loại: Bán hàng / Content / CSKH / Vận hành. Mỗi prompt tốt ghi thêm <i>"dùng khi nào"</i>.</p>',
exercise:'Viết 5 prompt theo cấu trúc 5 phần cho 5 việc bạn làm hàng tuần, lưu vào file Kho Prompt.'},
{id:'m4l3',title:'System prompt nâng cao cho Gem',minutes:30,
body:'<p>Nâng cấp Gem ở module 1 lên "nhân viên xuất sắc" bằng kỹ thuật nâng cao:</p><ul><li><b>Few-shot:</b> đưa 3–5 cặp hỏi–đáp mẫu, Gem sẽ bắt chước đúng giọng.</li><li><b>Chuỗi suy nghĩ:</b> <i>"Trước khi trả lời, hãy phân tích: khách thuộc nhóm nào, lo ngại gì..."</i></li><li><b>Kịch bản rẽ nhánh:</b> <i>"Nếu khách hỏi giá → báo giá + ưu đãi. Nếu khách chê đắt → đưa 3 lý do xứng đáng."</i></li><li><b>Persona + kiến thức:</b> nạp file sản phẩm vào phần Kiến thức của Gem.</li></ul><p>Test Gem bằng 10 câu hỏi khó nhất của khách — sửa system prompt đến khi ưng ý.</p>',
exercise:'Nâng cấp 1 Gem đã tạo ở module 1 bằng đủ 4 kỹ thuật trên, test với 10 câu hỏi khó.'},
{id:'m4l4',title:'Tự động nhắc việc & tác vụ lặp lại',minutes:25,
body:'<ul><li><b>Gemini Scheduled Tasks:</b> lên lịch prompt chạy tự động, ví dụ mỗi sáng 7h: <i>"Tóm tắt 5 tin tức AI mới nhất liên quan đến bán hàng online"</i>.</li><li><b>Quy trình content định kỳ:</b> Thứ 2 lên ý tưởng tuần → Thứ 3–6 viết bài → Chủ nhật tổng kết.</li><li><b>Nhắc việc cá nhân:</b> <i>"Nhắc tôi follow-up khách chưa chốt đơn mỗi tối 21h"</i>.</li><li>Kết hợp với module 3: lịch chạy → ghi vào Sheets → gửi thông báo.</li></ul>',
exercise:'Tạo 3 tác vụ lặp lại tự động phục vụ công việc của bạn trong 7 ngày tới.'}
]},

{id:'m5',num:'05',title:'MODULE TẠO ẢNH',desc:'Từ prompt đến ảnh bán hàng: Gemini, Imagen, Whisk, Flow và quy trình đồng bộ.',lessons:[
{id:'m5l1',title:'Tư duy prompt tạo ảnh đẹp',minutes:25,
body:'<p>Công thức prompt ảnh 6 thành phần:</p><ol><li><b>Chủ thể:</b> vẽ cái gì (sản phẩm, người, khung cảnh).</li><li><b>Hành động/khung hình:</b> cận cảnh, toàn cảnh, góc chụp.</li><li><b>Phong cách:</b> ảnh thật, 3D, anime, tối giản...</li><li><b>Ánh sáng & màu:</b> sáng tự nhiên, tone ấm, nền pastel...</li><li><b>Bối cảnh:</b> đặt ở đâu.</li><li><b>Tỉ lệ:</b> vuông 1:1 (bài đăng), dọc 9:16 (story/reels), ngang 16:9 (banner).</li></ol><p>Ví dụ: <i>"Chụp cận cảnh chai serum thủy tinh trên bàn đá cẩm thạch, ánh sáng tự nhiên buổi sáng, tone trắng-xanh pastel, phong cách quảng cáo mỹ phẩm Hàn Quốc, tỉ lệ 1:1."</i></p>',
exercise:'Viết 5 prompt ảnh theo công thức 6 thành phần cho 5 sản phẩm/nội dung của bạn.'},
{id:'m5l2',title:'Tạo ảnh sản phẩm & banner với Gemini',minutes:30,
body:'<ul><li>Trong Gemini, mô tả ảnh bằng tiếng Việt tự nhiên, đính kèm <b>ảnh thật sản phẩm</b> để AI giữ đúng hình dáng.</li><li><b>Ảnh sản phẩm:</b> đổi phông nền, đổi bối cảnh theo mùa/lễ mà không cần chụp lại.</li><li><b>Banner/cover:</b> yêu cầu chừa khoảng trống để chèn chữ.</li><li><b>Chân dung/nhân vật:</b> mô tả chi tiết trang phục, phụ kiện để giữ <b>đồng nhất</b> qua nhiều ảnh.</li><li>Không ưng → mô tả điểm cần sửa (<i>"nền tối hơn, chữ to hơn"</i>) thay vì tạo lại từ đầu.</li></ul><p>Lưu ý bản quyền: ảnh AI dùng cho quảng cáo nên kiểm tra kỹ logo/thương hiệu, tránh tạo ảnh nhái thương hiệu nổi tiếng.</p>',
exercise:'Tạo bộ 5 ảnh cho 1 sản phẩm: 1 ảnh chính + 2 ảnh bối cảnh + 1 banner + 1 ảnh story dọc.'},
{id:'m5l3',title:'Whisk & Flow: nâng cấp ảnh',minutes:30,
body:'<ul><li><b>Whisk:</b> trộn ảnh — lấy <i>chủ thể</i> từ ảnh A + <i>phong cách</i> từ ảnh B + <i>bối cảnh</i> từ ảnh C. Tuyệt vời để tạo ảnh "người thật + sản phẩm thật" mà không cần buổi chụp.</li><li><b>Flow (image):</b> tạo ảnh chất lượng cao, chỉnh sửa từng vùng bằng prompt.</li><li>Quy trình: Gemini phác thảo ý tưởng → Whisk/Flow tạo ảnh chuẩn → chỉnh sửa chi tiết.</li></ul>',
exercise:'Dùng Whisk tạo 3 ảnh: sản phẩm của bạn trong 3 bối cảnh khác nhau (sang trọng, đời thường, lễ hội).'},
{id:'m5l4',title:'Quy trình ảnh đồng bộ cho shop',minutes:25,
body:'<p>Khách nhớ shop qua <b>phong cách ảnh nhất quán</b>. Xây "brand kit ảnh":</p><ul><li>Chốt 1 tone màu + 1 kiểu ánh sáng + 1 kiểu bố cục dùng cho mọi ảnh.</li><li>Lưu prompt mẫu vào Kho Prompt (module 4), mỗi lần chỉ thay tên sản phẩm.</li><li>Checklist trước khi đăng: đúng tỉ lệ? đủ sáng? không dính chữ/logo lạ? đồng bộ với các ảnh cũ?</li><li>Lưu ảnh gốc + prompt vào Drive theo cấu trúc module 2 để tái sử dụng.</li></ul>',
exercise:'Chốt brand kit ảnh của bạn (tone màu, ánh sáng, bố cục, prompt mẫu) và tạo 5 ảnh đồng bộ.'}
]},

{id:'m6',num:'06',title:'MODULE TẠO VIDEO',desc:'Kịch bản bằng Gemini, dựng video bằng Flow/Veo, dây chuyền sản xuất video ngắn.',lessons:[
{id:'m6l1',title:'Bản đồ video AI của Google',minutes:20,
body:'<ul><li><b>Veo:</b> mô hình tạo video từ text/image — nhân vật, chuyển động, âm thanh ngày càng thật.</li><li><b>Flow:</b> "studio" dựng phim bằng AI: viết prompt từng cảnh, nối cảnh thành video hoàn chỉnh.</li><li><b>Gemini:</b> viết kịch bản, lời thoại, chia cảnh.</li><li><b>YouTube Create / CapCut:</b> hậu kỳ: cắt, sub, nhạc, hiệu ứng.</li></ul><p>Dây chuyền chuẩn: <b>Gemini (kịch bản) → Flow/Veo (cảnh quay) → app edit (hoàn thiện) → đăng</b>.</p>',
exercise:'Vẽ sơ đồ dây chuyền video của riêng bạn: mỗi khâu dùng công cụ gì, mất bao lâu.'},
{id:'m6l2',title:'Viết kịch bản video bằng Gemini',minutes:30,
body:'<p>Cấu trúc kịch bản video ngắn 60 giây:</p><ol><li><b>Hook (0–3s):</b> câu hỏi gây tò mò / con số sốc / cảnh bất ngờ.</li><li><b>Nội dung (4–45s):</b> 3 ý chính, mỗi ý 1 câu ngắn + minh họa.</li><li><b>CTA (46–60s):</b> follow / comment / inbox — chỉ 1 hành động.</li></ol><p>Prompt mẫu: <i>"Viết kịch bản 60s giới thiệu [sản phẩm] cho [khách hàng], văn phong miền Nam gần gũi, có hook 3s và CTA comment. Xuất dạng bảng: Thời gian | Lời thoại | Hình ảnh minh họa."</i></p>',
exercise:'Dùng prompt mẫu viết 3 kịch bản cho 3 sản phẩm/nội dung khác nhau.'},
{id:'m6l3',title:'Dựng video với Flow (Veo)',minutes:40,
body:'<ul><li><b>Text-to-video:</b> dán từng cảnh trong kịch bản thành prompt: mô tả <i>nhân vật + hành động + góc máy + ánh sáng</i>.</li><li><b>Image-to-video:</b> dùng ảnh đã tạo ở module 5 làm khung hình đầu, AI "thổi hồn" chuyển động.</li><li><b>Nối cảnh:</b> giữ mô tả nhân vật/bối cảnh <b>giống hệt nhau</b> qua các prompt để video liền mạch.</li><li><b>Lời thoại:</b> thu giọng bằng app hoặc AI voice, ghép sub tự động.</li><li>Render thử độ phân giải thấp trước, ưng ý mới render bản đẹp (tiết kiệm credit).</li></ul>',
exercise:'Dựng 1 video 30–60s hoàn chỉnh từ kịch bản ở bài trước: đủ cảnh, lời thoại, sub.'},
{id:'m6l4',title:'Dây chuyền sản xuất video ngắn hàng loạt',minutes:30,
body:'<p>Muốn đăng đều mỗi ngày mà không kiệt sức:</p><ul><li><b>Batch theo tuần:</b> 1 buổi viết 7 kịch bản → 1 buổi dựng 7 video → hẹn giờ đăng cả tuần.</li><li><b>Template:</b> 3–5 format ruột (review, before-after, hỏi-đáp, behind the scenes) xoay vòng.</li><li><b>Kho tư liệu:</b> ảnh, nhạc, intro/outro lưu sẵn trong Drive.</li><li><b>Đo lường:</b> cuối tuần xem video nào view cao → nhân bản format đó.</li></ul>',
exercise:'Lên lịch sản xuất tuần tới: 7 ý tưởng + template cho từng video + ngày đăng cụ thể.'}
]},

{id:'m7',num:'07',title:'MODULE TẠO ỨNG DỤNG',desc:'Biến ý tưởng thành app thật bằng Google AI Studio và Antigravity — không cần biết code.',lessons:[
{id:'m7l1',title:'Từ ý tưởng đến app không cần code',minutes:20,
body:'<p>App = giải quyết 1 việc cụ thể cho 1 nhóm người. Trước khi build, trả lời 4 câu:</p><ol><li>App giúp <b>ai</b> làm <b>việc gì</b> nhanh hơn?</li><li>Người dùng nhập gì vào, nhận gì ra? (ví dụ: nhập cân nặng + mục tiêu → nhận thực đơn 7 ngày)</li><li>Có cần lưu dữ liệu không, hay dùng 1 lần?</li><li>Tiêu chí "app chạy được" tối thiểu là gì?</li></ol><p>Ví dụ app phù hợp: tính giá ship, tra cứu sản phẩm, tạo báo giá nhanh, quản lý thu chi cá nhân.</p>',
exercise:'Viết 3 ý tưởng app cho công việc của bạn theo đúng 4 câu hỏi trên, chọn 1 ý tưởng để build ở bài tiếp theo.'},
{id:'m7l2',title:'Google AI Studio: app đầu tiên trong 30 phút',minutes:40,
body:'<ul><li>Truy cập <code>aistudio.google.com</code> → <b>Build</b> (chế độ tạo app).</li><li>Mô tả app bằng tiếng Việt tự nhiên, càng chi tiết càng tốt: <i>"App tính giá bán lẻ: nhập giá nhập, % lợi nhuận, phí ship → hiện giá bán đề xuất và lợi nhuận, giao diện tiếng Việt, màu xanh lá."</i></li><li>AI sinh app → bấm chạy thử ngay trong trình duyệt.</li><li>Chưa ưng → mô tả điểm cần sửa trong ô chat (<i>"thêm nút copy kết quả"</i>), AI tự sửa code.</li><li>Lặp lại: mô tả → xem → sửa, cho đến khi app chạy đúng ý.</li></ul><p>Bí quyết: chia app lớn thành nhiều app nhỏ, mỗi app làm tốt 1 việc.</p>',
exercise:'Build app đầu tiên từ ý tưởng đã chọn ở bài 1, test đủ các trường hợp và chụp màn hình.'},
{id:'m7l3',title:'Antigravity: nâng cấp & quản lý app',minutes:35,
body:'<p><b>Antigravity</b> là môi trường làm việc với AI để phát triển app "nghiêm túc" hơn:</p><ul><li>Mở project app từ AI Studio, xem cấu trúc file (HTML/CSS/JS).</li><li>Nhờ AI: <i>"thêm trang lịch sử các lần tính"</i>, <i>"lưu dữ liệu vào trình duyệt để không mất khi tải lại"</i>.</li><li>AI sửa nhiều file cùng lúc, bạn chỉ việc mô tả và kiểm tra kết quả.</li><li>Quản lý phiên bản: trước mỗi thay đổi lớn, nhờ AI tóm tắt "đang sửa gì" để dễ quay lại.</li></ul><p>Bạn không cần đọc hiểu từng dòng code — nhưng cần <b>test kỹ</b> sau mỗi lần AI sửa.</p>',
exercise:'Mở app của bạn trong Antigravity, thêm 1 tính năng mới (lưu lịch sử / xuất file / chế độ tối).'},
{id:'m7l4',title:'Xuất bản & chia sẻ app',minutes:25,
body:'<ul><li><b>AI Studio:</b> bấm Share/Chia sẻ để lấy link dùng thử ngay.</li><li><b>Xuất bản thật:</b> đẩy code lên GitHub → kết nối Vercel → có link <code>ten-app.vercel.app</code> chạy 24/7 (đúng quy trình đã dùng cho trang thương hiệu cá nhân).</li><li>Đặt tên app + viết 3 dòng mô tả cho người dùng.</li><li>Gửi link cho 5 người dùng thử, thu thập góp ý, sửa 1 vòng.</li><li>Gắn link app vào landing page / trang cá nhân để khách dùng.</li></ul>',
exercise:'Xuất bản app của bạn thành link thật, gửi cho 5 người dùng thử và ghi lại 3 góp ý quan trọng nhất.'}
]},

{id:'m8',num:'08',title:'MODULE TẠO LANDING PAGE',desc:'Dựng trang bán hàng chuyển đổi cao: cấu trúc AIDDA, content, AI build, thanh toán.',lessons:[
{id:'m8l1',title:'Giải phẫu landing page bán hàng',minutes:25,
body:'<p>Công thức <b>AIDDA</b> của mọi landing page bán được hàng:</p><ol><li><b>Attention:</b> hero + tiêu đề "đánh trúng" + nút CTA ngay màn hình đầu.</li><li><b>Interest:</b> nỗi đau khách hàng (3–5 gạch đầu dòng "bạn có đang...").</li><lI><b>Desire:</b> giải pháp + lợi ích + bằng chứng (feedback, con số).</li><li><b>Action:</b> bảng giá + form đăng ký + thanh toán — càng ít bước càng tốt.</li></ol><p>Chuẩn mobile-first: 80% khách xem bằng điện thoại. 1 màn hình = 1 ý, nút CTA lặp lại sau mỗi 2–3 khối nội dung.</p>',
exercise:'Phân tích 1 landing page bạn thích theo đúng 4 chữ AIDDA, ghi lại 3 điểm muốn học theo.'},
{id:'m8l2',title:'Viết content landing page với Gemini',minutes:30,
body:'<p>Dùng prompt theo từng khối:</p><ul><li><b>Hero:</b> <i>"Viết 5 tiêu đề cho landing page bán [sản phẩm] cho [khách hàng], mỗi tiêu đề dưới 12 chữ, đánh vào nỗi đau [nỗi đau chính]."</i></li><li><b>Nỗi đau:</b> <i>"Liệt kê 5 nỗi đau của [khách hàng] khi chưa có [sản phẩm], viết dạng "Bạn có đang...?"</i></li><li><b>Lợi ích:</b> <i>"Chuyển 5 tính năng sau thành 5 lợi ích cho khách hàng: ..."</i></li><li><b>FAQ:</b> <i>"Viết 6 câu hỏi thường gặp và câu trả lời ngắn khi mua [sản phẩm]."</i></li></ul><p>Gom tất cả vào 1 file Docs <i>"Content-Landing-[Tên SP]"</i> — đây là "kịch bản" để AI dựng trang ở bài sau.</p>',
exercise:'Viết full content cho 1 landing page (hero, nỗi đau, lợi ích, giá, FAQ) và lưu vào Docs.'},
{id:'m8l3',title:'Dựng landing page bằng AI',minutes:40,
body:'<ul><li><b>Cách 1 – AI Studio/Stitch:</b> dán content + mô tả phong cách (<i>"tone xanh mint, nút CTA gradient xanh lá→cam, mobile-first"</i>) → AI sinh trang → xem trước → yêu cầu chỉnh.</li><li><b>Cách 2 – Antigravity:</b> khi cần trang 1 file offline như các sản phẩm của Nàng Ba MMO.</li><li>Checklist trước khi chốt: hiển thị đẹp trên điện thoại? nút CTA bấm được? ảnh không vỡ? tốc độ tải nhanh?</li><li>Lưu bản nháp, nhờ 3 người khác điện thoại mở thử và cho nhận xét.</li></ul>',
exercise:'Dựng landing page hoàn chỉnh từ content đã viết ở bài 2, test trên 2 điện thoại khác nhau.'},
{id:'m8l4',title:'Gắn form, VietQR & xuất bản',minutes:30,
body:'<ul><li><b>Form đăng ký:</b> chỉ xin thông tin thật sự cần (tên, SĐT) — mỗi ô thêm vào giảm tỉ lệ điền.</li><li><b>VietQR:</b> tạo mã QR đúng chuẩn NAPAS (số tài khoản, số tiền, nội dung) để khách quét là chuyển khoản đúng.</li><li><b>Lưu đơn:</b> đơn hàng lưu lại để bạn liên hệ chốt (giai đoạn đầu lưu trên trình duyệt/admin đơn giản là đủ).</li><li><b>Xuất bản:</b> GitHub → Vercel, có link thật trong 5 phút.</li><li><b>Đo lường:</b> đếm lượt bấm nút CTA / lượt điền form mỗi tuần để tối ưu.</li></ul>',
exercise:'Hoàn thiện landing page: form + VietQR + xuất bản link thật, tự đặt 1 đơn test trọn vẹn.'}
]},

{id:'m9',num:'09',title:'MODULE TỰ ĐỘNG HÓA',desc:'Để máy làm việc lặp lại: Apps Script + Gemini API, CSKH tự động, trợ lý vận hành.',lessons:[
{id:'m9l1',title:'Tìm điểm nghẽn để tự động hóa',minutes:20,
body:'<p>Đừng tự động hóa bừa — hãy tìm việc <b>lặp lại + tốn thời gian + dễ sai</b>:</p><ul><li>Liệt kê 10 việc bạn làm mỗi tuần, chấm điểm: tần suất × thời gian × độ chán.</li><li>Top 3 điểm cao nhất = ứng viên tự động hóa đầu tiên.</li><li>Ví dụ điển hình: copy đơn từ form vào sổ, nhắc lịch hẹn, gửi báo giá mẫu, tổng hợp doanh thu cuối ngày.</li><li>Nguyên tắc: tự động hóa việc đã <b>làm đúng bằng tay</b> trước — máy chỉ nhân bản quy trình, không sửa quy trình sai.</li></ul>',
exercise:'Lập bảng 10 việc/tuần của bạn, chấm điểm và chọn ra top 3 để tự động hóa.'},
{id:'m9l2',title:'Apps Script + Gemini API',minutes:40,
body:'<ul><li><b>Gemini API:</b> lấy API key miễn phí tại AI Studio → gọi AI từ trong code.</li><li><b>Kịch bản 1:</b> mỗi sáng script đọc sheet đơn hàng → nhờ Gemini tóm tắt → gửi email báo cáo cho bạn.</li><li><b>Kịch bản 2:</b> khách điền form → Gemini viết tin nhắn cảm ơn cá nhân hóa → script gửi email tự động.</li><li><b>Kịch bản 3:</b> comment/inbox mới → phân loại (hỏi giá / khiếu nại / chốt đơn) → gắn nhãn ưu tiên.</li><li>Công thức làm việc: <b>mô tả cho Gemini → copy code → dán vào Apps Script → test trên bản copy → đặt lịch chạy</b>.</li></ul><p>Bắt đầu từ 1 kịch bản duy nhất. Chạy ổn 1 tuần mới thêm kịch bản 2.</p>',
exercise:'Triển khai 1 trong 3 kịch bản trên cho công việc thật của bạn.'},
{id:'m9l3',title:'Chăm sóc khách hàng tự động',minutes:35,
body:'<p>Chuỗi CSKH tự động 5 chạm sau khi khách để lại thông tin:</p><ol><li><b>Ngay lập tức:</b> tin nhắn cảm ơn + xác nhận đã nhận thông tin.</li><li><b>Sau 2 giờ:</b> gửi thêm thông tin sản phẩm + feedback khách cũ.</li><li><b>Ngày 2:</b> giải đáp 3 thắc mắc phổ biến nhất.</li><li><b>Ngày 4:</b> ưu đãi giới hạn thời gian.</li><li><b>Ngày 7:</b> hỏi thăm lần cuối, mời vào nhóm cộng đồng.</li></ol><p>Dùng Sheets + Apps Script + mẫu tin nhắn do Gemini viết. Khách "im lặng" sau chạm 5 → chuyển sang danh sách chăm sóc thủ công.</p>',
exercise:'Viết 5 tin nhắn cho chuỗi CSKH của sản phẩm chính, cài đặt gửi tự động 2 chạm đầu tiên.'},
{id:'m9l4',title:'Trợ lý vận hành cho công việc của bạn',minutes:30,

/* ================= STORE ================= */
let CONTENT=null;
function getContent(){if(!CONTENT){const ov=dbGet('lms_content_v1',null);CONTENT=ov||JSON.parse(JSON.stringify(DEFAULT_CONTENT))}return CONTENT}
function saveContent(){dbSet('lms_content_v1',CONTENT)}
function genCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<6;i++)s+=A[Math.floor(Math.random()*A.length)];return s}
function getDevice(){let id='';try{id=localStorage.getItem('lms_device_id')||''}catch(e){}
if(!id){id='d'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);try{localStorage.setItem('lms_device_id',id)}catch(e){}}
const ua=(navigator.userAgent||'');return{id:id,type:/mobile|android|iphone|ipad|phone/i.test(ua)?'phone':'computer'}}
function ensureUser(u){let ch=false;if(!u.code){u.code=genCode();ch=true}if(!Array.isArray(u.devices)){u.devices=[];ch=true}return ch}
function getUsers(){const u=dbGet('lms_users_v1',null);let s,nd=false;
if(u){s=u}else{s=[{id:'u_demo',username:'demo',name:'Học viên Demo',phone:'0900000000',email:'',pass:hashPw('demo123'),createdAt:Date.now()}];nd=true}
let ch=nd;s.forEach(x=>{if(ensureUser(x))ch=true;if(x.id==='u_demo'&&!x.email){x.email='demo@gmail.com';ch=true}});
if(ch)dbSet('lms_users_v1',s);return s}
function saveUsers(u){dbSet('lms_users_v1',u)}
function getSettings(){return dbGet('lms_settings_v1',{adminPass:hashPw('nangba123')})}
function saveSettings(s){dbSet('lms_settings_v1',s)}
function getProg(){return dbGet('lms_prog_v1',{})}
function saveProg(p){dbSet('lms_prog_v1',p)}
function sessGet(){try{return JSON.parse(localStorage.getItem('lms_sess_v1'))||JSON.parse(sessionStorage.getItem('lms_sess_v1'))}catch(e){return null}}
function sessSet(s){try{localStorage.setItem('lms_sess_v1',JSON.stringify(s))}catch(e){}}
function sessClear(){try{localStorage.removeItem('lms_sess_v1')}catch(e){};try{sessionStorage.removeItem('lms_sess_v1')}catch(e){}}

/* ================= STATS ================= */
function allLessons(){const o=[];getContent().modules.forEach(m=>m.lessons.forEach(l=>o.push({mid:m.id,lid:l.id})));return o}
function totalLessons(){return allLessons().length}
function doneSet(uid){return getProg()[uid]||{}}
function userStats(uid){const d=doneSet(uid),t=totalLessons();let n=0;allLessons().forEach(x=>{if(d[x.lid])n++});return{done:n,total:t,pct:t?Math.round(n/t*100):0}}
function modStats(mid,uid){const m=getContent().modules.find(x=>x.id===mid);if(!m)return{done:0,total:0,pct:0};const d=doneSet(uid);let n=0;m.lessons.forEach(l=>{if(d[l.id])n++});const t=m.lessons.length;return{done:n,total:t,pct:t?Math.round(n/t*100):0}}
function modMinutes(m){return m.lessons.reduce((a,l)=>a+(+l.minutes||0),0)}
function firstIncomplete(uid){const d=doneSet(uid);for(const m of getContent().modules){for(const l of m.lessons){if(!d[l.id])return{mid:m.id,lid:l.id,m:m,l:l}}}return null}
function firstOpenLesson(mid,uid){const d=doneSet(uid);const m=getContent().modules.find(x=>x.id===mid);if(!m||!m.lessons||!m.lessons.length)return null;for(const l of m.lessons){if(!d[l.id])return l}return m.lessons[0]}
function isMobileView(){try{return window.matchMedia('(max-width:1150px)').matches}catch(e){return false}}
function findLesson(mid,lid){const m=getContent().modules.find(x=>x.id===mid);if(!m)return null;const l=m.lessons.find(x=>x.id===lid);return l?{m:m,l:l}:null}
function lessonNav(mid,lid){const all=allLessons();const ix=all.findIndex(x=>x.lid===lid);const g=k=>{if(k<0||k>=all.length)return null;const a=all[k];const t=findLesson(a.mid,a.lid);return{mid:a.mid,id:a.lid,title:t.l.title}};return{prev:g(ix-1),next:g(ix+1)}}

  if(!s){t.innerHTML='';return}
  const nm=s.role==='admin'?'Quản trị viên':(getUsers().find(u=>u.id===s.uid)||{}).name||'Học viên';
  t.innerHTML='<span style="font-size:13px;margin-right:8px">👋 '+esc(nm)+'</span><button class="topbtn" onclick="App.logout()">Đăng xuất</button>'}
function render(){document.body.classList.toggle('fullw',R.s==='lesson');setTop();const s=sessGet();const app=$('app');
  if(R.s==='login'||!s){vLogin();return}
  if(s.role==='admin'){
    if(R.s==='adash')aDash();else if(R.s==='ausers')aUsers();else if(R.s==='auser')aUserDetail(R.uid);
    else if(R.s==='acontent')aContent();else if(R.s==='aset')aSettings();else aDash();return}
  if(R.s==='home')vHome();else if(R.s==='module')vModule(R.mid);else if(R.s==='lesson')vLesson(R.mid,R.lid);
  else if(R.s==='profile')vProfile();else vHome()}

function ytID(u){const m=String(u||'').match(/(?:youtube\.com\/(?:watch\?[^#]*v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{6,})/);return m?m[1]:null}
const DEMO_VIDEO='https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4';
function videoHTML(u,demo){u=String(u||'').trim();const id=ytID(u);
if(id)return '<div class="vidwrap"><iframe src="https://www.youtube.com/embed/'+id+'" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe></div>';
if(/\.mp4(\?|#|$)/i.test(u))return '<div class="vidwrap"><video src="'+esc(u)+'" controls playsinline preload="metadata"></video></div>';
if(u)return '<div style="margin:12px 0"><a class="btn btn-teal btn-sm" href="'+esc(u)+'" target="_blank" rel="noopener">\u25b6 Xem video h\u01b0\u1edbng d\u1eabn</a></div>';
if(demo)return '<div class="vidwrap"><video src="'+DEMO_VIDEO+'" controls playsinline preload="metadata"></video></div><div class="demotag">\U0001f39c VIDEO DEMO \u2014 s\u1ebd thay b\u1eb1ng video b\u00e0i h\u1ecdc th\u1eadt</div>';
return ''}
function lessonTasks(l){if(l.tasks&&l.tasks.length)return{title:'',items:l.tasks};
const ex=String(l.exercise||'').trim();if(!ex)return{title:'',items:[]};
const parts=ex.split(/\s*\(\d+\)\s*/).map(x=>x.trim().replace(/[,;]\s*$/,'')).filter(Boolean);
if(parts.length>=3&&parts[0].length<=60)return{title:parts[0].replace(/:\s*$/,''),items:parts.slice(1)};

function fileToAvatar(file,cb){const img=new Image();
  img.onload=()=>{try{const S=160,c=document.createElement('canvas');c.width=S;c.height=S;
    const x=c.getContext('2d'),s=Math.min(img.width,img.height);
    x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,S,S);
    cb(c.toDataURL('image/jpeg',.82))}catch(e){cb(null)};URL.revokeObjectURL(img.src)};
  img.onerror=()=>cb(null);img.src=URL.createObjectURL(file)}

function avClamp(){const e=App._avEdit;if(!e||!e.C)return;
  const mx=Math.max(0,(e.dw*e.scale-e.C)/2),my=Math.max(0,(e.dh*e.scale-e.C)/2);
  e.ox=Math.max(-mx,Math.min(mx,e.ox));e.oy=Math.max(-my,Math.min(my,e.oy))}
function avApply(){const e=App._avEdit;if(!e)return;const img=$('avCropImg');if(!img)return;
  img.style.width=e.dw+'px';img.style.height=e.dh+'px';
  img.style.left=((e.C-e.dw)/2)+'px';img.style.top=((e.C-e.dh)/2)+'px';
  img.style.transform='translate('+e.ox+'px,'+e.oy+'px) scale('+e.scale+')'}

avPick(file){

avModal(){
  const e=App._avEdit;if(!e)return;
  openModal('<h3>🖼️ Căn chỉnh ảnh đại diện</h3>'+
  '<div class="avcrop" id="avCrop"><img id="avCropImg" src="'+e.url+'" draggable="false" alt=""></div>'+
  '<label class="lbl">Phóng to / thu nhỏ</label><input type="range" id="avZoom" min="1" max="3" step="0.05" value="1" style="width:100%">'+
  '<div class="note">👉 Kéo ảnh để căn chỉnh vị trí, dùng thanh trượt để phóng to / thu nhỏ</div><div class="err" id="avErr"></div>'+
  '<div style="margin-top:10px"><button class="btn btn-teal btn-sm" onclick="App.avSave()">\u2713 Dùng ảnh này</button> '+
  '<button class="btn btn-ghost btn-sm" onclick="App.avRepick()">📷 Chọn ảnh khác</button> '+
  '<button class="btn btn-ghost btn-sm" onclick="App.closeModal()">Hủy</button></div>');
  const setup=()=>{
    const box=$('avCrop');if(!box||!App._avEdit)return;
    const ee=App._avEdit,C=box.clientWidth||260;
    ee.C=C;ee.dw=C*Math.max(1,ee.nw/ee.nh);ee.dh=C*Math.max(1,ee.nh/ee.nw);
    ee.scale=1;ee.ox=0;ee.oy=0;avApply();
    const zi=$('avZoom');if(zi)zi.oninput=()=>{ee.scale=parseFloat(zi.value);avClamp();avApply()};
    let drag=null;
    box.onpointerdown=ev=>{drag={x:ev.clientX,y:ev.clientY,ox:ee.ox,oy:ee.oy};try{box.setPointerCapture(ev.pointerId)}catch(_){}};
    box.onpointermove=ev=>{if(!drag)return;ee.ox=drag.ox+(ev.clientX-drag.x);ee.oy=drag.oy+(ev.clientY-drag.y);avClamp();avApply()};
    box.onpointerup=()=>{drag=null};box.onpointercancel=()=>{drag=null};
  };
  setTimeout(setup,40);
  const im=$('avCropImg');if(im)im.onload=setup},
avSave(){
  const e=App._avEdit;if(!e)return;
  try{
    const S=160,C=e.C,kx=e.nw/e.dw;
    let sx=(C/2+(-C/2-e.ox)/e.scale)*kx,sy=(C/2+(-C/2-e.oy)/e.scale)*kx;
    const sw=(C/e.scale)*kx,sh=(C/e.scale)*kx;
    sx=Math.max(0,Math.min(e.nw-sw,sx));sy=Math.max(0,Math.min(e.nh-sh,sy));
    const c=document.createElement('canvas');c.width=S;c.height=S;
    c.getContext('2d').drawImage(e.img,sx,sy,sw,sh,0,0,S,S);
    const data=c.toDataURL('image/jpeg',.85);
    URL.revokeObjectURL(e.url);App._avEdit=null;
    App._avaData=data;
    const ha=$('hAva');if(ha)ha.innerHTML='<img class="havaimg" src="'+data+'">';
    App.closeModal();
  }catch(err){const a=$('avErr');if(a){a.style.display='block';a.textContent='Không xử lý được ảnh này.'}}},
avRepick(){const e=App._avEdit;if(e){URL.revokeObjectURL(e.url);App._avEdit=null}App.closeModal();const f=$('avFile');if(f)f.click()},

  '<label class="lbl">Mô tả ngắn (hiện dưới tiêu đề)</label><input class="input" id="mlSub" value="'+esc(l&&l.sub?l.sub:'')+'" placeholder="VD: Hiểu bản chất...">'+
  '<label class="lbl">Link video hướng dẫn (YouTube hoặc mp4 \u2014 \u0111\u1ec3 tr\u1ed1ng n\u1ebfu ch\u01b0a c\u00f3)</label><input class="input" id="mlVideo" value="'+esc(l&&l.video?l.video:'')+'" placeholder="https://www.youtube.com/watch?v=...">'+
  '<label class="lbl">Checklist bài tập (mỗi dòng 1 việc — để trống = tự tách từ nội dung bài tập)</label><textarea class="input" id="mlTasks" rows="4">'+esc(l&&l.tasks?l.tasks.join(String.fromCharCode(10)):'')+'</textarea>'+'<label class="lbl">Nội dung (hỗ trợ HTML)</label><textarea class="input" id="mlBody" rows="8">'+esc(l?l.body:'<p></p>')+'</textarea>'+
  '<label class="lbl">Bài tập thực hành</label><textarea class="input" id="mlEx" rows="3">'+esc(l?l.exercise:'')+'</textarea>'+
  '<div class="mrow"><button class="btn btn-ghost" onclick="App.closeModal()">Hủy</button>'+
  '<button class="btn btn-cta" onclick="App.saveLesson(\''+mid+'\',\''+(l?l.id:'')+'\')">Lưu</button></div>')},
saveLesson(mid,lid){const m=getContent().modules.find(x=>x.id===mid);
  const d={title:$('mlTitle').value.trim(),minutes:+$('mlMin').value||20,video:$('mlVideo').value.trim(),sub:$('mlSub').value.trim(),tasks:$('mlTasks').value.split(String.fromCharCode(10)).map(function(x){return x.trim()}).filter(Boolean),body:$('mlBody').value,exercise:$('mlEx').value.trim()};
  if(!d.title){alert('Vui lòng nhập tên bài học.');return}
  if(lid){Object.assign(m.lessons.find(x=>x.id===lid),d)}else{m.lessons.push(Object.assign({id:uid('l')},d))}
  saveContent();closeModal();render()},
delLesson(mid,lid){const m=getContent().modules.find(x=>x.id===mid);const l=m.lessons.find(x=>x.id===lid);
  if(!confirm('Xóa bài học "'+l.title+'"?'))return;
  m.lessons=m.lessons.filter(x=>x.id!==lid);saveContent();render()},
/* --- cài đặt --- */
changeAdminPw(){const st=getSettings();const o=$('apOld').value,n1=$('apNew').value,n2=$('apNew2').value;
  const bad=m=>{const e=$('apErr');e.style.display='block';e.textContent=m;$('apOk').style.display='none'};
  if(hashPw(o)!==st.adminPass)return bad('Mật khẩu hiện tại chưa đúng.');
  if(n1.length<6)return bad('Mật khẩu mới phải từ 6 ký tự.');
  if(n1!==n2)return bad('Nhập lại chưa khớp.');
  st.adminPass=hashPw(n1);saveSettings(st);$('apErr').style.display='none';
  const ok=$('apOk');ok.style.display='block';ok.textContent='Đổi mật khẩu quản trị thành công!';
  $('apOld').value=$('apNew').value=$('apNew2').value=''},
doExport(){const data={app:'gemini-lms',users:getUsers(),prog:getProg(),content:getContent(),settings:getSettings(),exportedAt:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='lms-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove()},
doImport(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);
    if(d.app!=='gemini-lms'||!d.users||!d.content)throw 0;
    dbSet('lms_users_v1',d.users);dbSet('lms_prog_v1',d.prog||{});dbSet('lms_content_v1',d.content);
    if(d.settings)dbSet('lms_settings_v1',d.settings);CONTENT=null;
    const ok=$('impOk');ok.style.display='block';ok.textContent='Nhập dữ liệu thành công! Đang tải lại...';
    setTimeout(()=>render(),800);
  }catch(e){const er=$('impErr');er.style.display='block';er.textContent='File không hợp lệ.'}};
  r.readAsText(f);inp.value=''},
resetContent(){if(!confirm('Khôi phục nội dung khóa học về bản gốc? Các chỉnh sửa của bạn sẽ mất.'))return;
  localStorage.removeItem('lms_content_v1');CONTENT=null;render()}
};
window.App=App;

/* ================= INIT ================= */
document.body.insertAdjacentHTML('beforeend','<div class="modal" id="modal" onclick="if(event.target===this)App.closeModal()"><div class="box" id="modalBox"></div></div>');
document.body.insertAdjacentHTML('beforeend','<button id="toTop" title="V\u1ec1 \u0111\u1ea7u trang">\u2191</button>');
$('toTop').onclick=function(){window.scrollTo(0,0)};
window.addEventListener('scroll',function(){var b=$('toTop');if(b)b.classList.toggle('show',window.scrollY>400)},{passive:true});
render();
</script>
</body>
